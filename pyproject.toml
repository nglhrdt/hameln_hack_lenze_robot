[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "input_to_cmd"
version = "0.1.0"
description = "A Python project for input_to_cmd."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "openai",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
