<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenze Robot Control</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            align-content: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            flex: 0 1 500px;
            width: 100%;
            max-width: 500px;
        }
        .device-view {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: 0;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn.loading {
            pointer-events: none;
        }
        #text-command-spinner[hidden] {
            display: none !important;
        }
        .btn.command-active {
            box-shadow: 0 0 0 4px #ffc107;
        }
        [data-kasten-only][hidden] {
            display: none !important;
        }
        #configuration-retry[hidden] {
            display: none !important;
        }
        .settings-dialog {
            width: min(90vw, 480px);
            border: 0;
            border-radius: 0.5rem;
            padding: 1.5rem;
        }
        .image-marquee {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .image-marquee img {
            display: block;
            width: 64px;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .image-marquee {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header bg-primary text-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h5 class="card-title mb-0">Lenze Roboter Steuerung</h5>
            <label class="visually-hidden" for="device-type">Gerätetyp</label>
            <select class="form-select form-select-sm w-auto" id="device-type" disabled>
                <option value="kasten">Kasten</option>
                <option value="raeder">Räder</option>
            </select>
        </div>
        <div class="card-body">
            <p class="card-text">
                Willkommen zur Roboter-Steuerungsoberfläche. 
            </p>
            <p class="small mb-1" id="configuration-status" role="status">Konfiguration wird geladen...</p>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-2" id="configuration-retry" hidden>Erneut laden</button>
            <p class="text-center mb-0" id="position">X: -- | Z: --</p>
            <p class="text-center text-muted small mb-2" id="status">Verbindung wird hergestellt...</p>
            <div class="d-flex justify-content-center">
                <div style="width: 240px;">
                    <!-- Row 1 -->
                    <div class="d-grid gap-2 mb-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div></div>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_up">
                            <i class="bi bi-arrow-up" style="font-size: 1.5rem;"></i>
                        </button>
                        <div></div>
                    </div>
                    
                    <!-- Row 2 -->
                    <div class="d-grid gap-2 mb-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_left">
                            <i class="bi bi-arrow-left" style="font-size: 1.5rem;"></i>
                        </button>
                        <button class="btn btn-danger rounded-pill p-3" data-command="stop">
                            <i class="bi bi-stop-fill" style="font-size: 1.5rem;"></i>
                        </button>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_right">
                            <i class="bi bi-arrow-right" style="font-size: 1.5rem;"></i>
                        </button>
                    </div>
                    
                    <!-- Row 3 -->
                    <div class="d-grid gap-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div></div>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_down">
                            <i class="bi bi-arrow-down" style="font-size: 1.5rem;"></i>
                        </button>
                        <div></div>
                    </div>
                </div>
            </div>
            <p class="text-center small mb-0" id="hidden-command" aria-live="polite"></p>
        </div>
        <div class="card-footer text-muted">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <small>Version 1.0 | Lenze AI Robot</small>
                <button type="button" class="btn btn-primary btn-sm rounded-pill" data-command="home" data-kasten-only hidden>
                    <i class="bi bi-house" aria-hidden="true"></i> Home
                </button>
            </div>
            <small class="d-block mt-2">Ein Gerätetyp-Wechsel stoppt keine Bewegung.</small>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Textbefehl</h5>
        </div>
        <div class="card-body">
            <form id="text-command-form">
                <label class="form-label" for="text-command">Befehl</label>
                <textarea class="form-control" id="text-command" rows="4" aria-describedby="text-command-hint" required></textarea>
                <p class="form-text mb-3" id="text-command-hint">Strg + Eingabe zum Senden</p>
                <button class="btn btn-primary" type="submit">
                    <span class="spinner-border spinner-border-sm me-1" id="text-command-spinner" aria-hidden="true" hidden></span>Senden
                </button>
                <p class="small mt-2 mb-0" id="text-command-status" role="status"></p>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center gap-2">
            <h5 class="card-title mb-0">Geräteansicht</h5>
            <button type="button" class="btn btn-light btn-sm" id="iframe-edit" disabled>URL ändern</button>
        </div>
        <div class="card-body">
            <iframe class="device-view" id="device-frame" title="Geräteansicht"></iframe>
        </div>
    </div>

    <dialog class="settings-dialog" id="iframe-dialog" aria-labelledby="iframe-dialog-title">
        <form id="iframe-form">
            <h5 id="iframe-dialog-title">URL der Geräteansicht</h5>
            <label class="form-label" for="iframe-url">URL (HTTP oder HTTPS)</label>
            <input class="form-control mb-3" id="iframe-url" type="url" maxlength="2048" required>
            <button type="submit" class="btn btn-primary">Speichern</button>
            <button type="button" class="btn btn-secondary" id="iframe-cancel">Abbrechen</button>
            <button type="button" class="btn btn-danger" data-command="stop">Stop</button>
            <p class="small text-danger mt-2 mb-0" id="iframe-error" role="alert"></p>
        </form>
    </dialog>

    <div class="image-marquee" aria-hidden="true">
        <img src="./images/BlauerPacman.gif" alt="">
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script>
        const COMMANDS = ["home", "move_right", "move_up", "move_left", "move_down", "stop"];
        
        async function executeInstantCommand(command) {
            if (!COMMANDS.includes(command)) {
                console.error(`Invalid command: ${command}`);
                return;
            }
            
            try {
                const response = await fetch("/command", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        inputType: "instantCommand",
                        data: command,
                    }),
                });
                
                if (!response.ok) {
                    console.error(`Command execution failed: ${response.status} ${response.statusText}`);
                    return;
                }
                
                const result = await response.json();
                console.log(`Command executed: ${command}`, result);
            } catch (error) {
                console.error(`Error executing command: ${error}`);
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            const textForm = document.getElementById("text-command-form");
            const textInput = document.getElementById("text-command");
            const textStatus = document.getElementById("text-command-status");
            const textSubmit = textForm.querySelector('button[type="submit"]');
            const textSpinner = document.getElementById("text-command-spinner");

            textInput.addEventListener("keydown", function(e) {
                if (e.key === "Enter" && e.ctrlKey && !e.altKey && !e.metaKey &&
                    !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    if (!e.repeat && !textSubmit.disabled) {
                        textForm.requestSubmit(textSubmit);
                    }
                }
            });

            textForm.addEventListener("submit", async function(e) {
                e.preventDefault();
                if (textSubmit.disabled) {
                    return;
                }
                const text = textInput.value;
                if (!text.trim()) {
                    textStatus.classList.add("text-danger");
                    textStatus.textContent = "Bitte einen Befehl eingeben.";
                    return;
                }

                textSubmit.disabled = true;
                textSubmit.setAttribute("aria-busy", "true");
                textSpinner.hidden = false;
                textStatus.classList.remove("text-danger");
                textStatus.textContent = "Befehl wird verarbeitet...";
                try {
                    const response = await fetch("/command", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({inputType: "text", data: text}),
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    if (textInput.value === text) {
                        textInput.value = "";
                    }
                    textStatus.textContent = "Befehl gesendet.";
                } catch (error) {
                    console.error("Text command failed", error);
                    textStatus.classList.add("text-danger");
                    textStatus.textContent = `Befehl konnte nicht gesendet werden: ${error.message}`;
                } finally {
                    textSpinner.hidden = true;
                    textSubmit.removeAttribute("aria-busy");
                    textSubmit.disabled = false;
                }
            });

            const deviceType = document.getElementById("device-type");
            const hiddenCommand = document.getElementById("hidden-command");
            const configurationStatus = document.getElementById("configuration-status");
            const configurationRetry = document.getElementById("configuration-retry");
            const iframeEdit = document.getElementById("iframe-edit");
            const iframeDialog = document.getElementById("iframe-dialog");
            const iframeForm = document.getElementById("iframe-form");
            const iframeUrl = document.getElementById("iframe-url");
            const iframeError = document.getElementById("iframe-error");
            const iframeSave = iframeForm.querySelector('button[type="submit"]');
            const iframeCancel = document.getElementById("iframe-cancel");
            const deviceFrame = document.getElementById("device-frame");
            let configurationLoaded = false;
            let savedDeviceType;
            let savedIframeUrl;

            function updateHiddenCommand() {
                const activeButton = document.querySelector("[data-command].command-active");
                hiddenCommand.textContent = activeButton && activeButton.closest("[hidden]")
                    ? `Aktiver Befehl: ${activeButton.dataset.command}`
                    : "";
            }

            function updateDeviceType() {
                document.querySelectorAll("[data-kasten-only]").forEach(element => {
                    element.hidden = !configurationLoaded || deviceType.value === "raeder";
                });
                updateHiddenCommand();
            }

            async function saveConfiguration(changes) {
                const response = await fetch("/configuration", {
                    method: "PATCH",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(changes),
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            }

            async function loadConfiguration() {
                configurationLoaded = false;
                deviceType.disabled = true;
                iframeEdit.disabled = true;
                configurationRetry.hidden = true;
                configurationStatus.classList.remove("text-danger");
                configurationStatus.textContent = "Konfiguration wird geladen...";
                updateDeviceType();
                try {
                    const response = await fetch("/configuration");
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const configuration = await response.json();
                    const url = new URL(configuration.iframe_url);
                    if (!["kasten", "raeder"].includes(configuration.device_type) ||
                        !["http:", "https:"].includes(url.protocol) || url.username || url.password) {
                        throw new Error("Ungültige Konfiguration");
                    }
                    savedDeviceType = configuration.device_type;
                    savedIframeUrl = configuration.iframe_url;
                    deviceType.value = savedDeviceType;
                    deviceFrame.src = savedIframeUrl;
                    configurationLoaded = true;
                    deviceType.disabled = false;
                    iframeEdit.disabled = false;
                    configurationStatus.textContent = "";
                    updateDeviceType();
                } catch (error) {
                    console.error("Could not load configuration", error);
                    configurationStatus.classList.add("text-danger");
                    configurationStatus.textContent = `Konfiguration konnte nicht geladen werden: ${error.message}`;
                    configurationRetry.hidden = false;
                }
            }

            configurationRetry.addEventListener("click", loadConfiguration);
            deviceType.addEventListener("change", async function() {
                const selected = deviceType.value;
                deviceType.disabled = true;
                configurationStatus.classList.remove("text-danger");
                configurationStatus.textContent = "Gerätetyp wird gespeichert...";
                updateDeviceType();
                try {
                    const configuration = await saveConfiguration({device_type: selected});
                    savedDeviceType = configuration.device_type;
                    deviceType.value = savedDeviceType;
                    configurationStatus.textContent = "";
                } catch (error) {
                    console.error("Could not save device type", error);
                    deviceType.value = savedDeviceType;
                    configurationStatus.classList.add("text-danger");
                    configurationStatus.textContent = `Gerätetyp konnte nicht gespeichert werden: ${error.message}`;
                } finally {
                    deviceType.disabled = false;
                    updateDeviceType();
                }
            });

            iframeEdit.addEventListener("click", function() {
                iframeUrl.value = savedIframeUrl;
                iframeError.textContent = "";
                iframeDialog.showModal();
            });
            iframeCancel.addEventListener("click", () => iframeDialog.close());
            iframeDialog.addEventListener("cancel", function(e) {
                if (iframeSave.disabled) {
                    e.preventDefault();
                }
            });
            iframeForm.addEventListener("submit", async function(e) {
                e.preventDefault();
                if (iframeSave.disabled) {
                    return;
                }
                const url = new URL(iframeUrl.value);
                if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) {
                    iframeError.textContent = "Bitte eine HTTP- oder HTTPS-URL ohne Zugangsdaten eingeben.";
                    return;
                }
                iframeSave.disabled = true;
                iframeCancel.disabled = true;
                iframeUrl.disabled = true;
                iframeError.textContent = "";
                try {
                    const configuration = await saveConfiguration({iframe_url: iframeUrl.value});
                    savedIframeUrl = configuration.iframe_url;
                    deviceFrame.src = savedIframeUrl;
                    iframeDialog.close();
                } catch (error) {
                    console.error("Could not save iframe URL", error);
                    iframeError.textContent = `URL konnte nicht gespeichert werden: ${error.message}`;
                } finally {
                    iframeSave.disabled = false;
                    iframeCancel.disabled = false;
                    iframeUrl.disabled = false;
                }
            });

            loadConfiguration();

            document.querySelectorAll("[data-command]").forEach(button => {
                button.addEventListener("click", function(e) {
                    e.preventDefault();
                    const command = this.getAttribute("data-command");
                    this.disabled = true;
                    this.classList.add("loading");
                    
                    executeInstantCommand(command).finally(() => {
                        this.disabled = false;
                        this.classList.remove("loading");
                    });
                });
            });

            const keyboardCommands = new Map([
                ["ArrowUp", "move_up"],
                ["ArrowLeft", "move_left"],
                ["ArrowRight", "move_right"],
                ["ArrowDown", "move_down"],
                ["h", "home"],
                ["s", "stop"],
            ]);

            document.addEventListener("keydown", function(e) {
                if (e.ctrlKey || e.altKey || e.metaKey || e.isComposing || iframeDialog.open ||
                    (e.target instanceof HTMLElement &&
                        (e.target.isContentEditable || e.target.closest("input, textarea, select")))) {
                    return;
                }

                const command = keyboardCommands.get(e.key.length === 1 ? e.key.toLowerCase() : e.key);
                if (!command) {
                    return;
                }
                const button = document.querySelector(`[data-command="${command}"]`);
                if (button.closest("[hidden]")) {
                    return;
                }
                e.preventDefault();
                if (!e.repeat) {
                    button.click();
                }
            });

            const position = document.getElementById("position");
            const status = document.getElementById("status");
            const buttons = document.querySelectorAll("[data-command]");

            function clearStatus(message) {
                buttons.forEach(button => button.classList.remove("command-active"));
                updateHiddenCommand();
                position.textContent = "X: -- | Z: --";
                status.textContent = message;
            }

            function connectStatus() {
                if (!["http:", "https:"].includes(window.location.protocol)) {
                    clearStatus("Status nur über den Webserver verfügbar.");
                    return;
                }
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const socket = new WebSocket(`${protocol}//${window.location.host}/ws/status`);

                socket.addEventListener("message", function(event) {
                    let state;
                    try {
                        state = JSON.parse(event.data);
                    } catch (error) {
                        console.error("Invalid status message", error);
                        clearStatus("Ungültige Statusmeldung.");
                        return;
                    }
                    buttons.forEach(button => {
                        button.classList.toggle("command-active", button.dataset.command === state.command);
                    });
                    updateHiddenCommand();
                    if (state.position && Number.isFinite(state.position.x) && Number.isFinite(state.position.z)) {
                        position.textContent = `X: ${state.position.x.toFixed(2)} | Z: ${state.position.z.toFixed(2)}`;
                        status.textContent = "";
                    } else {
                        position.textContent = "X: -- | Z: --";
                        status.textContent = "Position nicht verfügbar.";
                    }
                });
                socket.addEventListener("error", function() {
                    console.error("Status WebSocket connection failed");
                });
                socket.addEventListener("close", function() {
                    clearStatus("Statusverbindung getrennt. Erneuter Verbindungsversuch...");
                    setTimeout(connectStatus, 2000);
                });
            }

            connectStatus();
        });
    </script>
</body>
</html>
