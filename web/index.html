<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenze Robot Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn.loading {
            pointer-events: none;
        }
        .image-marquee {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .image-marquee img {
            display: block;
            width: 64px;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .image-marquee {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Lenze Roboter Steuerung</h5>
        </div>
        <div class="card-body">
            <p class="card-text">
                Willkommen zur Roboter-Steuerungsoberfläche. 
            <div class="d-flex justify-content-center">
                <div style="width: 240px;">
                    <!-- Row 1 -->
                    <div class="d-grid gap-2 mb-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div></div>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_up">
                            <i class="bi bi-arrow-up" style="font-size: 1.5rem;"></i>
                        </button>
                        <div></div>
                    </div>
                    
                    <!-- Row 2 -->
                    <div class="d-grid gap-2 mb-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_left">
                            <i class="bi bi-arrow-left" style="font-size: 1.5rem;"></i>
                        </button>
                        <button class="btn btn-danger rounded-pill p-3" data-command="stop">
                            <i class="bi bi-stop-fill" style="font-size: 1.5rem;"></i>
                        </button>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_right">
                            <i class="bi bi-arrow-right" style="font-size: 1.5rem;"></i>
                        </button>
                    </div>
                    
                    <!-- Row 3 -->
                    <div class="d-grid gap-2" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div></div>
                        <button class="btn btn-primary rounded-pill p-3" data-command="move_down">
                            <i class="bi bi-arrow-down" style="font-size: 1.5rem;"></i>
                        </button>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer text-muted d-flex justify-content-between align-items-center">
            <small>Version 1.0 | Lenze AI Robot</small>
            <button type="button" class="btn btn-primary btn-sm rounded-pill" data-command="home">
                <i class="bi bi-house" aria-hidden="true"></i> Home
            </button>
        </div>
    </div>

    <div class="image-marquee" aria-hidden="true">
        <img src="./images/BlauerPacman.gif" alt="">
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script>
        const COMMANDS = ["home", "move_right", "move_up", "move_left", "move_down", "stop"];
        
        async function executeInstantCommand(command) {
            if (!COMMANDS.includes(command)) {
                console.error(`Invalid command: ${command}`);
                return;
            }
            
            try {
                const response = await fetch("/command", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        inputType: "instantCommand",
                        data: command,
                    }),
                });
                
                if (!response.ok) {
                    console.error(`Command execution failed: ${response.status} ${response.statusText}`);
                    return;
                }
                
                const result = await response.json();
                console.log(`Command executed: ${command}`, result);
            } catch (error) {
                console.error(`Error executing command: ${error}`);
            }
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll("[data-command]").forEach(button => {
                button.addEventListener("click", function(e) {
                    e.preventDefault();
                    const command = this.getAttribute("data-command");
                    this.disabled = true;
                    this.classList.add("loading");
                    
                    executeInstantCommand(command).finally(() => {
                        this.disabled = false;
                        this.classList.remove("loading");
                    });
                });
            });

            const keyboardCommands = new Map([
                ["ArrowUp", "move_up"],
                ["ArrowLeft", "move_left"],
                ["ArrowRight", "move_right"],
                ["ArrowDown", "move_down"],
                ["h", "home"],
                ["s", "stop"],
            ]);

            document.addEventListener("keydown", function(e) {
                if (e.ctrlKey || e.altKey || e.metaKey || e.isComposing ||
                    (e.target instanceof HTMLElement &&
                        (e.target.isContentEditable || e.target.closest("input, textarea, select")))) {
                    return;
                }

                const command = keyboardCommands.get(e.key.length === 1 ? e.key.toLowerCase() : e.key);
                if (!command) {
                    return;
                }
                e.preventDefault();
                if (!e.repeat) {
                    document.querySelector(`[data-command="${command}"]`).click();
                }
            });
        });
    </script>
</body>
</html>
